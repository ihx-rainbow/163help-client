name: CI / Release / Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v5*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ihx-rainbow/163help-client/docker-client
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: ci-release-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v5')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/release.sh
          ls -l dist

      - name: Create GitHub Release and upload assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/music-help.user.js "dist/163help-extension-v${VERSION}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "客户端 $VERSION" \
              --notes "网易云音乐互助客户端 $VERSION（油猴/扩展；Docker 镜像见 ghcr.io/ihx-rainbow/163help-client/docker-client）" \
              dist/music-help.user.js "dist/163help-extension-v${VERSION}.zip"
          fi
